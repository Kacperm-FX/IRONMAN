<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="21 Day Tracker">
<meta name="description" content="Track je trainingshabits voor triathlon en andere sporten — 21 dagen, elke dag bijhouden.">
<title>21 Day Tracker</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;21 Day Tracker&quot;,&quot;short_name&quot;:&quot;Tracker&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23ffffff&quot;,&quot;theme_color&quot;:&quot;%231D9E75&quot;}">
<style>
  :root {
    --green: #1D9E75;
    --green-dark: #0F6E56;
    --green-light: #E1F5EE;
    --green-mid: #9FE1CB;
    --blue: #378ADD;
    --blue-light: #E6F1FB;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --gray: #888780;
    --gray-light: #F1EFE8;
    --text: #2C2C2A;
    --text-muted: #888780;
    --border: #D3D1C7;
    --bg: #F8F7F4;
    --surface: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  /* NAV */
  .nav {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .nav-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 22px;
    padding: 4px;
    line-height: 1;
    border-radius: var(--radius-sm);
  }
  .icon-btn:active { background: var(--gray-light); }

  /* BOTTOM TAB BAR */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px 4px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-muted);
    font-size: 10px;
  }
  .tab-btn.active { color: var(--green); }
  .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* SCREENS */
  .screen { display: none; padding: 16px 16px 100px; }
  .screen.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 12px;
  }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* HABIT CHECKS */
  .habit-check {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .habit-check:last-child { border-bottom: none; }
  .habit-check:active { opacity: 0.7; }
  .check-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .15s;
    font-size: 16px;
  }
  .check-circle.done { border-color: transparent; }
  .habit-name { font-size: 15px; color: var(--text); flex: 1; }
  .habit-streak-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--green-light);
    color: var(--green-dark);
  }

  /* HEATMAP */
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(21, 1fr);
    gap: 3px;
    margin-bottom: 10px;
  }
  .hm-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--gray-light);
    cursor: default;
  }
  .hm-cell.today { outline: 2px solid var(--green); outline-offset: 1px; }
  .legend-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* WEEK VIEW */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .week-title-text { font-size: 13px; font-weight: 600; color: var(--text); }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .week-cell { text-align: center; }
  .wc-name { font-size: 10px; color: var(--text-muted); margin-bottom: 5px; }
  .wc-dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 auto; background: var(--gray-light); }
  .wc-dot.today { outline: 2px solid var(--green); outline-offset: 2px; }
  .wc-count { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  .week-prev-btn, .week-next-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-muted);
  }
  .week-prev-btn:active, .week-next-btn:active { background: var(--gray-light); }

  /* DONE BANNER */
  .done-banner {
    background: var(--green-light);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
    color: var(--green-dark);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    display: none;
  }

  /* PROGRESS BARS */
  .progress-habit { margin-bottom: 14px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .progress-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .progress-pct { font-size: 12px; color: var(--text-muted); }
  .progress-bar { height: 8px; background: var(--gray-light); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width .3s; }

  /* SETUP */
  .setup-label { font-size: 13px; color: var(--text-muted); display: block; margin-top: 14px; margin-bottom: 5px; }
  input[type=text], input[type=date], select {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    appearance: none;
  }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
  .habit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .habit-row input[type=text] { flex: 1; }
  .habit-row input[type=color] {
    width: 38px; height: 38px;
    padding: 2px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: none;
  }
  .remove-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 20px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .remove-btn:active { background: var(--gray-light); }
  .add-row-btn {
    width: 100%;
    padding: 10px;
    border: 0.5px dashed var(--border);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-row-btn:active { background: var(--gray-light); }
  .primary-btn {
    width: 100%;
    padding: 14px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    letter-spacing: .01em;
  }
  .primary-btn:active { background: var(--green-dark); }
  .danger-btn {
    width: 100%;
    padding: 12px;
    background: none;
    color: #A32D2D;
    border: 0.5px solid #F7C1C1;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  .danger-btn:active { background: #FCEBEB; }

  /* ONBOARDING */
  .onboard-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  .onboard-icon {
    width: 72px; height: 72px;
    background: var(--green-light);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    margin: 0 auto 24px;
  }
  .onboard-title { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .onboard-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
  .discipline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 24px; }
  .disc-btn {
    padding: 14px 8px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    transition: all .15s;
  }
  .disc-btn .disc-icon { font-size: 24px; display: block; margin-bottom: 4px; }
  .disc-btn.selected { border-color: var(--green); color: var(--green-dark); background: var(--green-light); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --text: #f0ede8;
      --text-muted: #888780;
      --border: #3a3a37;
      --gray-light: #2e2e2b;
      --green-light: #0a2e22;
      --green-mid: #0a4030;
    }
    input[type=text], input[type=date], select { background: #2e2e2b; color: var(--text); }
  }
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboard" style="display:none;">
  <div class="onboard-wrap">
    <div class="onboard-icon">🏊</div>
    <h1 class="onboard-title">21 Day Tracker</h1>
    <p class="onboard-sub">Bouw gewoontes op in 21 dagen.<br>Dagelijks afvinken, streaks bijhouden,<br>voortgang zien.</p>

    <p style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:10px;width:100%;text-align:left;">Kies je discipline</p>
    <div class="discipline-grid">
      <button class="disc-btn selected" data-disc="triathlon" onclick="selectDisc(this)"><span class="disc-icon">🏊‍♂️</span>Triathlon</button>
      <button class="disc-btn" data-disc="hardlopen" onclick="selectDisc(this)"><span class="disc-icon">🏃</span>Hardlopen</button>
      <button class="disc-btn" data-disc="fietsen" onclick="selectDisc(this)"><span class="disc-icon">🚴</span>Fietsen</button>
      <button class="disc-btn" data-disc="zwemmen" onclick="selectDisc(this)"><span class="disc-icon">🏊</span>Zwemmen</button>
      <button class="disc-btn" data-disc="custom" onclick="selectDisc(this)" style="grid-column:span 2;"><span class="disc-icon">✏️</span>Eigen doel</button>
    </div>
    <button class="primary-btn" onclick="finishOnboard()">Beginnen →</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" style="display:none;">
  <div class="nav">
    <div>
      <div class="nav-title" id="nav-title">21 Day Tracker</div>
      <div class="nav-sub" id="nav-sub">Dag 1 van 21</div>
    </div>
    <button class="icon-btn" onclick="showTab('settings')" aria-label="Instellingen">⚙️</button>
  </div>

  <!-- TODAY -->
  <div class="screen active" id="tab-today">
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="st-streak">0</div><div class="stat-lbl">🔥 streak</div></div>
      <div class="stat"><div class="stat-val" id="st-today">0/0</div><div class="stat-lbl">vandaag</div></div>
      <div class="stat"><div class="stat-val" id="st-pct">0%</div><div class="stat-lbl">totaal</div></div>
    </div>

    <div class="done-banner" id="done-banner">✅ Alles gedaan vandaag!</div>

    <div class="card">
      <div class="card-label" id="today-label">Vandaag</div>
      <div id="habit-checks"></div>
    </div>

    <div class="card">
      <div class="card-label">21 dagen</div>
      <div class="heatmap-grid" id="heatmap"></div>
      <div class="legend-row">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div>Alles</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green-mid);"></div>Gedeeltelijk</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--gray-light);"></div>Niets</div>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="screen" id="tab-progress">
    <div class="card">
      <div class="card-label">Per habit</div>
      <div id="progress-bars"></div>
    </div>

    <div class="card">
      <div class="card-label" style="margin-bottom:0;">Week</div>
      <div class="week-nav" style="margin-top:10px;">
        <button class="week-prev-btn" onclick="changeWeek(-1)">‹</button>
        <span class="week-title-text" id="week-lbl">Week 1</span>
        <button class="week-next-btn" onclick="changeWeek(1)">›</button>
      </div>
      <div class="week-grid" id="week-grid"></div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="tab-settings">
    <div class="card">
      <div class="card-label">Profiel</div>
      <label class="setup-label">Naam</label>
      <input type="text" id="s-name" placeholder="Jouw naam">
      <label class="setup-label">Doel / evenement</label>
      <input type="text" id="s-goal" placeholder="bijv. Wataha Triathlon 5 september">
    </div>
    <div class="card">
      <div class="card-label">Habits</div>
      <div id="s-habit-list"></div>
      <button class="add-row-btn" onclick="addHabitRow()">+ habit toevoegen</button>
    </div>
    <button class="primary-btn" onclick="saveSettings()">Opslaan</button>
    <button class="danger-btn" onclick="resetTracker()">Reset tracker (start opnieuw)</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-today" onclick="showTab('today')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Vandaag
    </button>
    <button class="tab-btn" id="tab-btn-progress" onclick="showTab('progress')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Voortgang
    </button>
    <button class="tab-btn" id="tab-btn-settings" onclick="showTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Instellingen
    </button>
  </div>
</div>

<script>
const DEFAULTS = {
  triathlon: [{name:'Zwemmen',color:'#378ADD'},{name:'Fietsen',color:'#1D9E75'},{name:'Hardlopen',color:'#D85A30'}],
  hardlopen: [{name:'Hardlopen',color:'#D85A30'},{name:'Stretchen',color:'#BA7517'},{name:'Krachttraining',color:'#888780'}],
  fietsen: [{name:'Fietsen',color:'#1D9E75'},{name:'Klimtraining',color:'#378ADD'},{name:'Stretchen',color:'#BA7517'}],
  zwemmen: [{name:'Zwemmen',color:'#378ADD'},{name:'Dryland training',color:'#1D9E75'},{name:'Techniek',color:'#888780'}],
  custom: [{name:'Habit 1',color:'#1D9E75'},{name:'Habit 2',color:'#378ADD'}],
};
const DAY_NAMES = ['zo','ma','di','wo','do','vr','za'];

let state = { userName:'', discipline:'triathlon', goal:'', habits:[], log:{}, startDay:null, currentWeek:0, onboarded:false };
let selectedDisc = 'triathlon';
let currentTab = 'today';

function load() {
  try { const s = localStorage.getItem('tri21'); if(s) state = JSON.parse(s); } catch(e){}
}
function save() {
  try { localStorage.setItem('tri21', JSON.stringify(state)); } catch(e){}
}
function todayKey() { return new Date().toISOString().slice(0,10); }
function dayIdx(key) {
  if (!state.startDay) return 0;
  return Math.round((new Date(key) - new Date(state.startDay)) / 86400000);
}

function selectDisc(btn) {
  document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDisc = btn.dataset.disc;
}

function finishOnboard() {
  state.discipline = selectedDisc;
  state.habits = DEFAULTS[selectedDisc] || DEFAULTS.triathlon;
  state.startDay = todayKey();
  state.onboarded = true;
  save();
  document.getElementById('onboard').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  populateSettings();
  render();
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const btn = document.getElementById('tab-btn-' + tab);
  if (btn) btn.classList.add('active');
  if (tab === 'progress') renderProgress();
  if (tab === 'settings') populateSettings();
}

function render() {
  const today = todayKey();
  const idx = Math.min(Math.max(dayIdx(today), 0), 20);
  document.getElementById('nav-title').textContent = state.userName ? state.userName + "'s tracker" : '21 Day Tracker';
  document.getElementById('nav-sub').textContent = 'Dag ' + (idx+1) + ' van 21' + (state.goal ? ' · ' + state.goal : '');

  const d = new Date();
  document.getElementById('today-label').textContent = d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});

  renderChecks(today);
  renderStats(today);
  renderHeatmap();
}

function renderChecks(today) {
  const log = state.log[today] || {};
  const cont = document.getElementById('habit-checks');
  cont.innerHTML = '';
  state.habits.forEach((h, i) => {
    const done = !!log[i];
    const streak = streakFor(i);
    const div = document.createElement('div');
    div.className = 'habit-check';
    div.onclick = () => toggle(today, i);
    div.innerHTML = `
      <div class="check-circle${done?' done':''}" style="${done?'background:'+h.color+';':''}">
        ${done ? '✓' : ''}
      </div>
      <span class="habit-name" style="${done?'text-decoration:line-through;color:var(--text-muted);':''}">${h.name}</span>
      ${streak > 0 ? '<span class="habit-streak-badge">🔥 ' + streak + '</span>' : ''}
    `;
    cont.appendChild(div);
  });
  const allDone = state.habits.length > 0 && state.habits.every((_,i) => !!(state.log[today]||{})[i]);
  document.getElementById('done-banner').style.display = allDone ? 'block' : 'none';
}

function toggle(day, idx) {
  if (!state.log[day]) state.log[day] = {};
  state.log[day][idx] = !state.log[day][idx];
  save();
  render();
}

function streakFor(habitIdx) {
  let streak = 0;
  const today = new Date(todayKey());
  for (let i = 0; i <= 20; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    if ((state.log[key]||{})[habitIdx]) streak++;
    else break;
  }
  return streak;
}

function currentStreak() {
  let streak = 0;
  const today = new Date(todayKey());
  for (let i = 0; i <= 20; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    const l = state.log[key] || {};
    if (state.habits.some((_,idx) => l[idx])) streak++;
    else break;
  }
  return streak;
}

function renderStats(today) {
  const log = state.log[today] || {};
  const done = state.habits.filter((_,i) => log[i]).length;
  document.getElementById('st-streak').textContent = currentStreak();
  document.getElementById('st-today').textContent = done + '/' + state.habits.length;
  let total = 0, possible = 0;
  for (let i = 0; i <= 20; i++) {
    const d = new Date(state.startDay); d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    if (key > todayKey()) break;
    const l = state.log[key] || {};
    state.habits.forEach((_,idx) => { possible++; if(l[idx]) total++; });
  }
  document.getElementById('st-pct').textContent = possible ? Math.round(total/possible*100) + '%' : '0%';
}

function renderHeatmap() {
  const grid = document.getElementById('heatmap');
  grid.innerHTML = '';
  const today = todayKey();
  for (let i = 0; i < 21; i++) {
    const d = new Date(state.startDay); d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    const l = state.log[key] || {};
    const done = state.habits.filter((_,idx) => l[idx]).length;
    const total = state.habits.length;
    const isFuture = key > today;
    const isToday = key === today;
    const cell = document.createElement('div');
    cell.className = 'hm-cell' + (isToday ? ' today' : '');
    if (!isFuture && total > 0) {
      const pct = done / total;
      if (pct === 1) cell.style.background = '#1D9E75';
      else if (pct >= 0.5) cell.style.background = '#9FE1CB';
      else if (pct > 0) cell.style.background = '#E1F5EE';
    }
    cell.title = 'Dag ' + (i+1) + ': ' + done + '/' + total;
    grid.appendChild(cell);
  }
}

function renderProgress() {
  const bars = document.getElementById('progress-bars');
  bars.innerHTML = '';
  state.habits.forEach((h, idx) => {
    let done = 0, possible = 0;
    for (let i = 0; i <= 20; i++) {
      const d = new Date(state.startDay); d.setDate(d.getDate() + i);
      const key = d.toISOString().slice(0,10);
      if (key > todayKey()) break;
      possible++;
      if ((state.log[key]||{})[idx]) done++;
    }
    const pct = possible ? Math.round(done/possible*100) : 0;
    const div = document.createElement('div');
    div.className = 'progress-habit';
    div.innerHTML = `
      <div class="progress-header">
        <span class="progress-name">${h.name}</span>
        <span class="progress-pct">${done}/${possible} dagen · ${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${h.color};"></div></div>
    `;
    bars.appendChild(div);
  });

  renderWeek();
}

function renderWeek() {
  const w = state.currentWeek;
  document.getElementById('week-lbl').textContent = 'Week ' + (w+1);
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  const today = todayKey();
  for (let i = 0; i < 7; i++) {
    const dayNum = w * 7 + i;
    const d = new Date(state.startDay); d.setDate(d.getDate() + dayNum);
    const key = d.toISOString().slice(0,10);
    const l = state.log[key] || {};
    const done = state.habits.filter((_,idx) => l[idx]).length;
    const total = state.habits.length;
    const isFuture = key > today || dayNum > 20;
    const isToday = key === today;
    let dotColor = 'var(--gray-light)';
    if (!isFuture && total > 0) {
      if (done === total) dotColor = '#1D9E75';
      else if (done > 0) dotColor = '#9FE1CB';
    }
    const cell = document.createElement('div');
    cell.className = 'week-cell';
    cell.innerHTML = `
      <div class="wc-name" style="${isToday?'font-weight:700;color:var(--text);':''}">${DAY_NAMES[d.getDay()]}</div>
      <div class="wc-dot${isToday?' today':''}" style="background:${dotColor};"></div>
      <div class="wc-count">${dayNum > 20 ? '' : done + '/' + total}</div>
    `;
    grid.appendChild(cell);
  }
}

function changeWeek(dir) {
  const n = state.currentWeek + dir;
  if (n < 0 || n > 2) return;
  state.currentWeek = n;
  renderWeek();
}

function addHabitRow(name='', color='#888780') {
  const list = document.getElementById('s-habit-list');
  const row = document.createElement('div');
  row.className = 'habit-row';
  row.innerHTML = `<input type="text" placeholder="bijv. Yoga 20 min" value="${name}"><input type="color" value="${color}"><button class="remove-btn" onclick="this.parentElement.remove()" aria-label="Verwijder">×</button>`;
  list.appendChild(row);
}

function populateSettings() {
  document.getElementById('s-name').value = state.userName || '';
  document.getElementById('s-goal').value = state.goal || '';
  const list = document.getElementById('s-habit-list');
  list.innerHTML = '';
  state.habits.forEach(h => addHabitRow(h.name, h.color));
}

function saveSettings() {
  const rows = document.querySelectorAll('#s-habit-list .habit-row');
  const habits = [];
  rows.forEach(row => {
    const name = row.querySelector('input[type=text]').value.trim();
    const color = row.querySelector('input[type=color]').value;
    if (name) habits.push({name, color});
  });
  if (!habits.length) { alert('Voeg minimaal één habit toe.'); return; }
  state.userName = document.getElementById('s-name').value.trim();
  state.goal = document.getElementById('s-goal').value.trim();
  state.habits = habits;
  save();
  showTab('today');
  render();
}

function resetTracker() {
  if (!confirm('Weet je zeker dat je opnieuw wilt beginnen? Al je data wordt gewist.')) return;
  state = { userName:'', discipline:'triathlon', goal:'', habits:[], log:{}, startDay:null, currentWeek:0, onboarded:false };
  save();
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('onboard').style.display = 'block';
}

load();
if (state.onboarded && state.habits.length) {
  document.getElementById('onboard').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  populateSettings();
  render();
} else {
  document.getElementById('onboard').style.display = 'block';
}
</script>
</body>
</html>
